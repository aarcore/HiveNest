[package]
name = "hivenest"
version = "0.1.1"
description = "Hive Nest — SSH sessions + Agent assist"
authors = ["Hive Nest"]
edition = "2021"

[lib]
name = "hivenest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-http = { version = "2", features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
