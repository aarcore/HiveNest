# Unsigned desktop builds for Linux / Windows / macOS.
# Does NOT perform Apple notarization or Windows Authenticode (cert placeholders in docs/11).
name: Desktop

on:
  push:
    paths:
      - 'client/**'
      - 'sessiond/**'
      - 'Makefile'
      - 'scripts/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'client/**'
      - 'sessiond/**'
      - 'Makefile'
      - 'scripts/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sessiond-sidecars:
    name: sessiond sidecars (cross-compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Prepare Tauri sidecars
        run: make prepare-sidecars
      - uses: actions/upload-artifact@v4
        with:
          name: sessiond-sidecars
          path: client/src-tauri/binaries/sessiond-*
          if-no-files-found: error

  tauri-linux:
    name: Tauri Linux (unsigned)
    runs-on: ubuntu-22.04
    needs: sessiond-sidecars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux WebKit / Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev
      - name: Sidecars + frontend
        run: |
          make prepare-sidecars
          make sessiond
          triple=$(rustc -vV | awk '/host:/ {print $2}')
          cp bin/sessiond "client/src-tauri/binaries/sessiond-$triple"
          cd client && npm ci
      - name: tauri build (unsigned deb + AppImage)
        working-directory: client
        # Override tauri.conf bundle.targets (repo defaults to ["app"] for macOS DMG workflow).
        run: npx tauri build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: hivenest-linux-unsigned
          path: |
            client/src-tauri/target/release/bundle/deb/*.deb
            client/src-tauri/target/release/bundle/appimage/*.AppImage
            client/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn

  tauri-windows:
    name: Tauri Windows (unsigned)
    runs-on: windows-latest
    needs: sessiond-sidecars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Sidecars + frontend
        shell: bash
        run: |
          make prepare-sidecars
          make sessiond
          triple=$(rustc -vV | awk '/host:/ {print $2}')
          cp bin/sessiond.exe "client/src-tauri/binaries/sessiond-${triple}.exe" 2>/dev/null \
            || cp bin/sessiond "client/src-tauri/binaries/sessiond-${triple}.exe"
          cd client && npm ci
      - name: tauri build (unsigned NSIS + MSI)
        working-directory: client
        run: npx tauri build --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: hivenest-windows-unsigned
          path: |
            client/src-tauri/target/release/bundle/nsis/*.exe
            client/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  tauri-macos:
    name: Tauri macOS (unsigned app)
    runs-on: macos-14
    needs: sessiond-sidecars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Sidecars + frontend
        run: |
          make prepare-sidecars
          make sessiond
          triple=$(rustc -vV | awk '/host:/ {print $2}')
          cp bin/sessiond "client/src-tauri/binaries/sessiond-$triple"
          cd client && npm ci
      - name: tauri build (unsigned app)
        working-directory: client
        run: npx tauri build --bundles app
      - name: Optional hdiutil DMG (no Finder)
        run: |
          MACOS_DIR=client/src-tauri/target/release/bundle/macos
          if [[ -d "$MACOS_DIR/Hive Nest.app" ]]; then
            APP="$MACOS_DIR/Hive Nest.app"
          elif [[ -d "$MACOS_DIR/HiveNest.app" ]]; then
            APP="$MACOS_DIR/HiveNest.app"
          else
            APP=""
          fi
          if [[ -n "$APP" ]]; then
            bash scripts/make-dmg.sh "$APP" dist/HiveNest-unsigned.dmg
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hivenest-macos-unsigned
          path: |
            client/src-tauri/target/release/bundle/macos/*.app
            dist/HiveNest-unsigned.dmg
          if-no-files-found: warn
